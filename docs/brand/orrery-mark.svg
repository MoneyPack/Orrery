<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Orrery Mission Control mark">
  <defs>
    <radialGradient id="core" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#e3a94e"/>
      <stop offset="55%" stop-color="#c98a36"/>
      <stop offset="100%" stop-color="#7a4d1a"/>
    </radialGradient>
    <radialGradient id="disc" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14181b"/>
      <stop offset="78%" stop-color="#0d1012"/>
      <stop offset="100%" stop-color="#090b0d"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e3a94e" stop-opacity=".9"/>
      <stop offset="50%" stop-color="#c98a36" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#e3a94e" stop-opacity=".9"/>
    </linearGradient>
  </defs>

  <circle cx="256" cy="256" r="248" fill="url(#disc)"/>
  <circle cx="256" cy="256" r="247" fill="none" stroke="#262d32" stroke-width="2"/>

  <!-- tick ring -->
  <g stroke="#39424a" stroke-width="2" opacity=".8">
    <line x1="256" y1="18" x2="256" y2="34"/>
    <line x1="256" y1="478" x2="256" y2="494"/>
    <line x1="18" y1="256" x2="34" y2="256"/>
    <line x1="478" y1="256" x2="494" y2="256"/>
    <line x1="88" y1="88" x2="99" y2="99"/>
    <line x1="413" y1="413" x2="424" y2="424"/>
    <line x1="424" y1="88" x2="413" y2="99"/>
    <line x1="99" y1="413" x2="88" y2="424"/>
  </g>

  <!-- outer orbit -->
  <ellipse cx="256" cy="256" rx="196" ry="150" fill="none" stroke="url(#ring)" stroke-width="3"/>
  <!-- inner orbit, tilted -->
  <g>
    <ellipse cx="256" cy="256" rx="132" ry="132" fill="none" stroke="#c98a36" stroke-width="2" stroke-dasharray="10 8" opacity=".75"/>
    <animateTransform attributeName="transform" type="rotate" from="0 256 256" to="360 256 256" dur="24s" repeatCount="indefinite"/>
  </g>

  <!-- mission satellite riding the outer orbit -->
  <g>
    <circle cx="452" cy="256" r="14" fill="#e9ecea"/>
    <circle cx="452" cy="256" r="14" fill="none" stroke="#e3a94e" stroke-width="3"/>
    <circle cx="452" cy="256" r="5" fill="#c98a36"/>
    <animateTransform attributeName="transform" type="rotate" from="0 256 256" to="360 256 256" dur="12s" repeatCount="indefinite"/>
  </g>

  <!-- core -->
  <circle cx="256" cy="256" r="58" fill="url(#core)"/>
  <circle cx="256" cy="256" r="58" fill="none" stroke="#e8b96c" stroke-width="2" opacity=".8"/>
  <circle cx="238" cy="238" r="12" fill="#fffaf2" opacity=".28"/>
  <!-- crosshair -->
  <g stroke="#19120a" stroke-width="5" stroke-linecap="round">
    <line x1="256" y1="228" x2="256" y2="284"/>
    <line x1="228" y1="256" x2="284" y2="256"/>
  </g>
  <circle cx="256" cy="256" r="9" fill="#19120a"/>
</svg>
