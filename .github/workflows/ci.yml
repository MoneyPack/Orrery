name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify lockfile freshness
        run: npm ci --ignore-scripts --dry-run

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and component tests
        run: npx vitest run

      - name: Production build
        run: npm run build

  smoke:
    name: Real mission kernel smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Git identity for disposable smoke repositories
        run: |
          git config --global user.email "orrery-ci@localhost"
          git config --global user.name "Orrery CI"

      - name: Real Git/worktree/evidence/promotion kernel smoke
        run: npm run mission:smoke
